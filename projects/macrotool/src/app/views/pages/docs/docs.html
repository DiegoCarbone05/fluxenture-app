<mat-drawer-container class="example-container">
    <mat-drawer mode="side" #sideNav opened>
        <flux-navbar title="Documentos"></flux-navbar>
    </mat-drawer>
    <mat-drawer-content class="app-content">
        <flux-toolbar title="Documentos">
            <button matButton="filled" color="primary" (click)="openDialog()">
                <mat-icon>add</mat-icon>
                Nuevo Documento
            </button>
        </flux-toolbar>

        <div class="table-container">

            <!-- Loading -->
            @if (isLoading()) {
            <div class="loading-wrapper">
                <mat-spinner diameter="40"></mat-spinner>
            </div>
            } @else {

            <!-- Tabla -->
            <mat-table [dataSource]="dataSource" matSort matSortActive="uploadDate" matSortDirection="desc" class="docs-table mat-elevation-z2">

                <!-- Empleado -->
                <ng-container matColumnDef="employee">
                    <mat-header-cell *matHeaderCellDef> Empleado </mat-header-cell>
                    <mat-cell *matCellDef="let doc">
                        {{ getEmployeeName(doc.employeeId) }}
                    </mat-cell>
                </ng-container>

                <!-- Tipo -->
                <ng-container matColumnDef="type">
                    <mat-header-cell *matHeaderCellDef> Tipo </mat-header-cell>
                    <mat-cell *matCellDef="let doc">
                        <span class="type-chip">{{ doc.type }}</span>
                    </mat-cell>
                </ng-container>

                <!-- Fecha -->
                <ng-container matColumnDef="uploadDate">
                    <mat-header-cell *matHeaderCellDef mat-sort-header> Fecha de Subida </mat-header-cell>
                    <mat-cell *matCellDef="let doc"> {{ formatDate(doc.uploadDate) }} </mat-cell>
                </ng-container>

                <!-- Descripción -->
                <ng-container matColumnDef="description">
                    <mat-header-cell *matHeaderCellDef> Descripción </mat-header-cell>
                    <mat-cell *matCellDef="let doc"> {{ doc.description || '-' }} </mat-cell>
                </ng-container>

                <!-- Acciones -->
                <ng-container matColumnDef="actions">
                    <mat-header-cell *matHeaderCellDef></mat-header-cell>
                    <mat-cell *matCellDef="let doc" class="actions-cell">
                        <button mat-icon-button color="warn" (click)="deleteDoc(doc)" matTooltip="Eliminar">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>

                <!-- Sin datos -->
                <tr class="mat-row no-data-row" *matNoDataRow>
                    <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                        <span>No hay documentos registrados</span>
                    </td>
                </tr>

            </mat-table>

            }
        </div>

    </mat-drawer-content>
</mat-drawer-container>
