<div class="m3-stat-top">
  <span class="m3-stat-label">{{ stat.label }}</span>
  <mat-icon [style.color]="stat.iconFg">{{ stat.icon }}</mat-icon>
</div>
<span class="m3-stat-value">{{ stat.value }}</span>
<span class="m3-stat-note" [style.color]="stat.noteFg">{{ stat.note }} {{ stat.noteText }}</span>
