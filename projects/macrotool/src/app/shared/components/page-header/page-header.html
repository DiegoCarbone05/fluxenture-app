<header class="header-desk" [class.header-compact]="compact">
  <div class="title-row">
    @if (showBack) {
    <button mat-icon-button class="back-btn" matTooltip="Volver" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    }
    <div [class.page-title]="!compact" [class.page-title-compact]="compact">
      <h1>{{ title }}</h1>
      @if (subtitle) {
      <span class="page-subtitle">{{ subtitle }}</span>
      }
    </div>
  </div>
  <div class="page-actions">

    <ng-content></ng-content>
    <flux-user-account-dialog />
  </div>
</header>
