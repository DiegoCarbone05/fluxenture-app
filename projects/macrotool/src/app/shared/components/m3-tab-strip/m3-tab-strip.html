@for (tab of tabs; track tab.key) {
  <button class="m3-tab" [class.active]="selected === tab.key" (click)="selectedChange.emit(tab.key)">
    <span class="m3-tab-label">
      {{ tab.mobileLabel ?? tab.label }}
      @if (tab.badge) {
        <span class="tab-badge">{{ tab.badge }}</span>
      }
    </span>
  </button>
}
